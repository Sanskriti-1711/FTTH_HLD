name: Keep the engine, the backend and the QGIS worker awake

# Render's free plan stops a web service after 15 minutes without traffic. Cold
# starts measured: backend 42 s, engine ~42 s, QGIS worker 415 s (2026-10-22) and
# 72.8 s (2026-11-07). A run cannot start until the worker answers, so a sleeping
# worker turns a submit into a wait-and-hope.
#
# ── Why the windows changed on 2026-11-07 ─────────────────────────────────────
# The old window was 09:00Z-12:00Z for all three services. Run d17dc623 was
# submitted at 13:41Z and failed at 13:56Z: the last ping had been at 12:00Z, the
# worker had slept, and the engine's wake probe spent its whole 900 s budget
# being answered with HTTP 429 by the platform edge. Nothing warmed anything
# between 12:00Z and the submit.
#
# The engine and the worker now keep working-day hours (09:00Z-17:00Z; 11:00-19:00
# in Berlin in winter). The backend keeps the short window: it is the cheapest to
# wake (~45 s) and user traffic hits it first anyway, so 09:00Z-12:00Z buys the
# morning peak without spending hours on a service that wakes itself.
#
# ── The hour budget is the constraint, and it is shared ────────────────────────
# Render grants **750 free instance hours per workspace per calendar month**,
# shared across every free web service, and a service only spends them while it
# is RUNNING (a spun-down service is free). All three awake 24/7 would
# be ~2,230 h/mo: the budget would be gone about ten days in and Render
# SUSPENDS free web services until the next calendar month — every service down
# at once, which is far worse than a cold start.
#
# At the windows below: (8 + 0.25) + (3 + 0.25) + (8 + 0.25) = 19.75 h/day
# x 31 days = **612 h/mo**, leaving ~138 h for runs and traffic outside the
# windows. A run in flight keeps its services awake on its own — a window only
# decides when PINGS happen, so narrowing one never cuts a running job.
#
# The budget is not eyeballed: the first step recomputes the monthly hours from
# the six *_FROM_UTC / *_TO_UTC values and refuses to warm anything if the
# result would not fit — the failure mode it prevents (every service suspended)
# cannot be fixed from inside the workflow that caused it.
#
# ── Two limits, both deliberate ───────────────────────────────────────────────
#   * **GitHub does not honour `*/10` on this repository.** The recorded runs of
#     2026-10-21/22/23 are **2-5 hours** apart; on 2026-11-07 the ticks were
#     01:55Z, 07:55Z and 14:28Z, so the 07:55Z tick is what held the window open
#     09:00Z-12:00Z. A tick therefore pings every 5 minutes for as long as a
#     window is open: a late tick still leaves the services awake for the rest of
#     the day, and `concurrency` keeps one loop running at a time.
#   * **One job cannot cover an eight-hour window** (GitHub's ceiling is 6 h).
#     The loop stops itself at 5 h 45 m; the next tick inside the window, which
#     `concurrency` queues rather than drops, carries on until 17:00Z. A tick
#     before the window holds until it opens, because GitHub's schedule is too
#     sparse to assume a second one will arrive.
#   * GitHub disables scheduled workflows in a repository with no activity for
#     60 days, so this needs a push (or a manual run) now and then. A manual
#     dispatch warms all three once, at any hour, windows ignored.
#
# The repository is public, so the runs do not draw on the private-repo minute
# quota.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

env:
  ENGINE_FROM_UTC: '9'
  ENGINE_TO_UTC: '17'
  BACKEND_FROM_UTC: '9'
  BACKEND_TO_UTC: '12'
  WORKER_FROM_UTC: '9'
  WORKER_TO_UTC: '17'
  MONTHLY_INSTANCE_HOURS: '750'
  WORKER_URL: https://ftth-qgis-worker.onrender.com
  # How long before the window a tick is allowed to hold and then warm. 4 h
  # covers the gap seen on this repository (05:24Z -> 09:00Z) without turning a
  # late-night tick into a wasted 5-hour job that warms nothing.
  MAX_PRE_WINDOW_WAIT_S: '14400'
  # Wait + loop must stay under GitHub's 6 h job ceiling (21600 s) with room to
  # finish the round in flight and print why it stopped.
  WARM_CEILING_S: '20700'

jobs:
  ping:
    name: Ping the services that sleep
    runs-on: ubuntu-latest
    # GitHub's ceiling for one job. 5 was the old value and it capped the whole
    # loop, not one step: the in-window loop died on its first sleep.
    timeout-minutes: 360
    steps:
      - name: Would these windows fit the instance-hour budget?
        id: budget
        run: |
          # 10# : an env value of '09' would otherwise be read as an invalid
          # octal literal and abort the step.
          engine_h=$(( 10#$ENGINE_TO_UTC - 10#$ENGINE_FROM_UTC ))
          backend_h=$(( 10#$BACKEND_TO_UTC - 10#$BACKEND_FROM_UTC ))
          worker_h=$(( 10#$WORKER_TO_UTC - 10#$WORKER_FROM_UTC ))
          for pair in "engine $engine_h" "backend $backend_h" "worker $worker_h"; do
            name=${pair% *}
            hours=${pair#* }
            if [ "$hours" -le 0 ]; then
              echo "::error::${name}: *_FROM_UTC is not before its *_TO_UTC"
              exit 1
            fi
          done
          # 31 days is the longest month, and +0.25 h per service is the 15 idle
          # minutes each one keeps running after its last ping of the day.
          monthly=$(awk -v e="$engine_h" -v b="$backend_h" -v w="$worker_h" \
            'BEGIN { printf "%.1f", ((e + 0.25) + (b + 0.25) + (w + 0.25)) * 31 }')
          echo "engine ${engine_h} h + backend ${backend_h} h + worker ${worker_h} h per day -> ${monthly} instance-hours in a 31-day month (budget ${MONTHLY_INSTANCE_HOURS})"
          if awk -v m="$monthly" -v b="$MONTHLY_INSTANCE_HOURS" 'BEGIN { exit !(m <= b) }'; then
            echo "budget=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::error::${monthly} instance-hours/mo at these windows would exhaust the ${MONTHLY_INSTANCE_HOURS}-hour budget and Render would suspend every free service. Narrow the *_FROM_UTC/*_TO_UTC values."
            exit 1
          fi

      - name: Is any window open, or about to open?
        id: window
        run: |
          # `10#` again: `date +%H` returns 08 and 09, which bash reads as
          # invalid octal. Zero-padded hours made the 09:00 tick report
          # "outside the window" -- the first warm hour of the day.
          hour=$(( 10#$(date -u +%H) ))
          minute=$(( 10#$(date -u +%M) ))
          now=$(( hour * 60 + minute ))
          # A manual dispatch always warms, once, so the workflow can be tested
          # (and a sleeping service woken) at any hour without waiting for a
          # window.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "wait_s=0" >> "$GITHUB_OUTPUT"
            echo "warming now (manual dispatch, utc $hour:$minute)"
            exit 0
          fi
          open=0
          for window in \
            "$ENGINE_FROM_UTC:$ENGINE_TO_UTC" \
            "$BACKEND_FROM_UTC:$BACKEND_TO_UTC" \
            "$WORKER_FROM_UTC:$WORKER_TO_UTC"; do
            from=$(( 10#${window%%:*} * 60 ))
            to=$(( 10#${window##*:} * 60 ))
            if [ "$now" -ge "$from" ] && [ "$now" -lt "$to" ]; then
              open=1
            fi
          done
          if [ "$open" -eq 1 ]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "wait_s=0" >> "$GITHUB_OUTPUT"
            echo "warming (utc $hour:$minute)"
            exit 0
          fi
          # Before every window today: the earliest opening decides the wait.
          earliest=$(printf '%s\n' \
            $(( 10#$ENGINE_FROM_UTC )) \
            $(( 10#$BACKEND_FROM_UTC )) \
            $(( 10#$WORKER_FROM_UTC )) | sort -n | head -1)
          open_min=$(( earliest * 60 ))
          if [ "$now" -lt "$open_min" ]; then
            wait_s=$(( (open_min - now) * 60 ))
            if [ "$wait_s" -le "$MAX_PRE_WINDOW_WAIT_S" ]; then
              echo "warm=true" >> "$GITHUB_OUTPUT"
              echo "wait_s=$wait_s" >> "$GITHUB_OUTPUT"
              echo "utc $hour:$minute is $(( wait_s / 60 )) min before the first window: holding this job, then warming"
              exit 0
            fi
          fi
          echo "warm=false" >> "$GITHUB_OUTPUT"
          echo "wait_s=0" >> "$GITHUB_OUTPUT"
          echo "outside every window (utc $hour:$minute): letting them sleep, this costs nothing"

      - name: Hold until the window opens
        if: steps.window.outputs.warm == 'true' && steps.window.outputs.wait_s != '0'
        env:
          WAIT_S: ${{ steps.window.outputs.wait_s }}
        run: |
          echo "holding ${WAIT_S}s until the first window opens (the services are asleep, so this costs no instance hours)"
          sleep "$WAIT_S"

      # 120s covers a 42s cold start plus Render's boot queue. The worker gets
      # 20s instead: its boot is minutes, so holding the request would only make
      # the round late. The request itself is what wakes it.
      #
      # A tick does not ping once and exit -- see the schedule note above. It
      # loops while any window is open, so the gaps between scheduled ticks no
      # longer leave the services asleep mid-day.
      - name: Keep the services awake while their windows are open
        if: steps.window.outputs.warm == 'true'
        timeout-minutes: 350
        env:
          WAIT_S: ${{ steps.window.outputs.wait_s }}
          FORCE: ${{ steps.window.outputs.force }}
        run: |
          set -o pipefail
          failed=0

          within() {
            from=$(( 10#$1 * 60 ))
            to=$(( 10#$2 * 60 ))
            [ "$now" -ge "$from" ] && [ "$now" -lt "$to" ]
          }

          # probe <name> <url> <timeout> <strict>
          #   strict=yes -> a non-200 is a failure (the service boots in seconds)
          #   strict=no  -> only a 4xx config error is a failure; "still booting"
          #                 and 429 are warnings, because both are expected once
          probe() {
            name=$1; url=$2; limit=$3; strict=$4
            # `|| true`, not `|| echo 000`: curl already writes 000 when the
            # connection never opened, and appending another made "000000".
            rm -f "/tmp/$name.json"
            code=$(curl -sS -o "/tmp/$name.json" -w '%{http_code}' -m "$limit" "$url" || true)
            code=${code:-000}
            echo "$name http_status=$code"
            head -c 300 "/tmp/$name.json" 2>/dev/null || true
            echo
            case "$code" in
              200) return 0 ;;
              429)
                # The edge is rate-limiting this runner, not refusing the
                # service: the 2026-10-22 incident was exactly this signal read
                # as "asleep". Do not fail the workflow for it.
                echo "::warning::$name /health answered 429 (rate limited); the next round will retry"
                return 0
                ;;
              401|403|404)
                echo "::error::$name /health answered $code: the URL is the wrong service or the route moved — waiting will not fix that"
                return 1
                ;;
            esac
            if [ "$strict" = "yes" ]; then
              echo "::warning::$name /health answered $code (a cold boot is expected occasionally; a run of failures is not)"
              return 1
            fi
            echo "$name did not answer within ${limit}s ($code): it is booting — the next round will find it awake"
            return 0
          }

          started=$(date -u +%s)
          # The loop shares the job with any wait above: stop before GitHub's 6 h
          # ceiling so this ends cleanly (and says why) instead of being killed.
          max_s=$(( WARM_CEILING_S - ${WAIT_S:-0} ))
          while :; do
            minute=$(( 10#$(date -u +%M) ))
            now=$(( 10#$(date -u +%H) * 60 + minute ))
            any=0
            round_failed=0

            if [ "${FORCE:-false}" = "true" ]; then
              any=1
              probe engine  https://ftth-planning.onrender.com/health  120 yes || round_failed=1
              probe backend https://fibre-backend-wml3.onrender.com/healthz 120 yes || round_failed=1
              probe worker  "$WORKER_URL/health" 20 no || round_failed=1
            else
              if within "$ENGINE_FROM_UTC" "$ENGINE_TO_UTC"; then
                any=1
                probe engine  https://ftth-planning.onrender.com/health  120 yes || round_failed=1
              fi
              if within "$BACKEND_FROM_UTC" "$BACKEND_TO_UTC"; then
                any=1
                probe backend https://fibre-backend-wml3.onrender.com/healthz 120 yes || round_failed=1
              fi
              # 20s, not 120s: the worker's boot is minutes, so holding the
              # request would only make the round late. The request itself is
              # what wakes it, and the ping that follows proves it came up.
              if within "$WORKER_FROM_UTC" "$WORKER_TO_UTC"; then
                any=1
                probe worker  "$WORKER_URL/health" 20 no || round_failed=1
              fi
            fi

            # Only the last round decides the job's status: a service that was
            # booting on the first round and answered on the next is a success.
            failed=$round_failed

            if [ "${FORCE:-false}" = "true" ]; then
              echo "manual dispatch: one round done at $(date -u +%H:%M)Z — stopping."
              break
            fi
            if [ "$any" -eq 0 ]; then
              echo "every window is closed at $(date -u +%H:%M)Z — stopping."
              break
            fi
            if [ $(( $(date -u +%s) - started )) -ge "$max_s" ]; then
              echo "$(( max_s / 60 )) min served; the next queued tick carries on while a window is open."
              break
            fi
            # A third of Render's 15-minute idle window, so one slow round
            # (three cold services, 120s each) cannot let one fall asleep.
            sleep 300
          done
          exit "$failed"
