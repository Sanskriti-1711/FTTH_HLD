name: Keep the engine and the backend awake (the worker wakes on demand)

# Render's free plan stops a web service after 15 minutes without traffic. A
# cold start measured 42s for the backend; the QGIS worker's measured **415 s**
# on the 2026-10-22 L1 8JQ run (`QGIS worker ready (415s)`).
#
# ── Why the worker is no longer on the schedule (2026-10-30) ───────────────────
# Pinging it bought almost nothing. A run keeps the worker awake by itself: the
# engine polls `/jobs/{id}/log` every 2 s while a run is in flight, and Render
# only counts *inbound* traffic. And a run never starts on a sleeping worker
# unannounced -- `wake_worker()` boots it from three places (run submit, area
# preview, run start), overlaps the boot with the OSM fetch, and the run log
# says "The QGIS worker is not awake yet (...); waiting for it". So the schedule
# was buying 415 s of latency avoided on the first run of the day, at a cost of
# 3 h/day of the shared instance-hour budget.
#
# The trade taken instead: the schedule warms only the engine and the backend,
# the worker boots on demand, and the engine's wake budget (`FTTH_QGIS_WORKER_WAKE`,
# 900 s) covers a 415 s boot plus Render's queue. A **manual dispatch still warms
# the worker** -- that is the "wake it now" button before a demo, at ~0.2 h a click.
#
# ── The hour budget is the constraint, and it is shared ────────────────────────
# Render grants **750 free instance hours per workspace per calendar month**,
# shared across every free web service, and a service only spends them while it
# is RUNNING (a spun-down service is free). The workspace has three free web
# services: the engine, the backend, and the worker. All three awake 24/7 would
# be ~2,230 h/mo: the budget would be gone about ten days in and Render
# SUSPENDS free web services until the next calendar month — every service down
# at once, which is far worse than a cold start.
#
# Hence a window: **3 h/day**, 09:00Z-12:00Z, narrowed from 7 h on 2026-10-30
# while the month's spare instance hours were still under review.
# 2 scheduled services x (3 h + 0.25 h of the 15-minute idle tail after the last
# ping) x 31 days = **201 h/mo** of the 750, leaving ~549 h for runs and traffic
# outside the window. Taking the worker off the schedule returned 101 h/mo.
# A run in flight keeps its services awake on its own -- the window only
# decides when PINGS happen, so narrowing it never cuts a running job.
# The engine and the backend used to get 11 h/day (07-18 UTC) at 660 h/mo
# between them; the worker's wake is minutes, theirs is seconds, so the three
# hours went to the service whose cold start actually hurts. 09-16 UTC is
# 10:00-17:00 in the UK, inside the old window.
#
# The budget is not eyeballed: the first step recomputes the monthly hours from
# WARM_FROM_UTC / WARM_TO_UTC / SERVICE_COUNT and refuses to warm anything if
# the result would not fit — the failure mode it prevents (every service
# suspended) cannot be fixed from inside the workflow that caused it.
#
# ── Two limits, both deliberate ───────────────────────────────────────────────
#   * **GitHub does not honour `*/10` on this repository.** The recorded runs
#     of 2026-10-21/22/23 are **2-5 hours** apart (10:15, 05:17, 00:35, 22:01,
#     18:52, 14:36 UTC; 2026-10-23 had ticks at 00:44 and 05:24 and nothing
#     else before 10:03), so one ping per tick woke a service that had been
#     asleep for most of the gap -- which is why the worker still had to boot
#     for 415 s with this workflow "running every ten minutes". A tick now
#     pings every 5 minutes until the window closes: a late tick still leaves
#     the services awake for the rest of the day, and `concurrency` keeps one
#     loop running at a time.
#   * **The job used to be capped at 5 minutes.** `timeout-minutes: 5` was the
#     JOB's limit, not the step's, so the loop was killed on its first
#     `sleep 300`: the 2026-10-22 15:18Z run was cancelled at 6.5 min, and
#     every other tick inside the window exited after three pings. That is why
#     the engine was asleep at **09:56:59Z on 2026-10-23** when the re-plan was
#     submitted at 10:03Z (the last tick was 05:24Z, outside the window): the
#     edge answered 429 and the run failed at 0 %. The job now gets GitHub's
#     6 h ceiling and the loop stops itself just short of it.
#   * **A tick before the window holds until it opens.** Ticks are 2-5 h apart,
#     so the one before 09:00Z is often the only one there is: it waits, then
#     warms. Waiting costs no Render instance hours (the services are asleep)
#     and public-repo runner minutes are free; wait + loop is capped at 5 h 45 m
#     so the job ends cleanly instead of being cancelled mid-ping.
#   * GitHub disables scheduled workflows in a repository with no activity for
#     60 days, so this needs a push (or a manual run) now and then. A manual
#     dispatch warms all three at any hour — engine, backend and the worker that
#     the schedule deliberately leaves alone.
#
# The repository is public, so the runs do not draw on the private-repo minute
# quota.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: false

env:
  WARM_FROM_UTC: '9'
  WARM_TO_UTC: '12'
  MONTHLY_INSTANCE_HOURS: '750'
  # Services the SCHEDULE keeps awake: engine + backend. The worker boots on
  # demand (see the header) and is only pinged by a manual dispatch, so it does
  # not draw on the scheduled budget — hence 2, not 3.
  SERVICE_COUNT: '2'
  WORKER_URL: https://ftth-qgis-worker.onrender.com
  # 'true' only for a manual dispatch: the scheduled window leaves the worker to
  # boot on demand, but the operator keeps a one-click wake for it.
  WARM_WORKER: ${{ github.event_name == 'workflow_dispatch' }}
  # How long before the window a tick is allowed to hold and then warm. 4 h
  # covers the gap seen on this repository (05:24Z -> 09:00Z) without turning a
  # late-night tick into a wasted 5-hour job that warms nothing.
  MAX_PRE_WINDOW_WAIT_S: '14400'
  # Wait + loop must stay under GitHub's 6 h job ceiling (21600 s) with room to
  # finish the round in flight and print why it stopped.
  WARM_CEILING_S: '20700'

jobs:
  ping:
    name: Ping the services that sleep
    runs-on: ubuntu-latest
    # GitHub's ceiling for one job. 5 was the old value and it capped the whole
    # loop, not one step: the in-window loop died on its first sleep.
    timeout-minutes: 360
    steps:
      - name: Would this window fit the instance-hour budget?
        id: budget
        run: |
          # 10# : an env value of '09' would otherwise be read as an invalid
          # octal literal and abort the step.
          hours=$(( 10#$WARM_TO_UTC - 10#$WARM_FROM_UTC ))
          if [ "$hours" -le 0 ]; then
            echo "::error::WARM_FROM_UTC ($WARM_FROM_UTC) is not before WARM_TO_UTC ($WARM_TO_UTC)"
            exit 1
          fi
          # 31 days is the longest month, and +0.25 h per service is the 15 idle
          # minutes each one keeps running after the last ping of the day.
          monthly=$(awk -v h="$hours" -v n="$SERVICE_COUNT" \
            'BEGIN { printf "%.1f", n * (h + 0.25) * 31 }')
          echo "window: ${hours} h/day x ${SERVICE_COUNT} services -> ${monthly} instance-hours in a 31-day month (budget ${MONTHLY_INSTANCE_HOURS})"
          if awk -v m="$monthly" -v b="$MONTHLY_INSTANCE_HOURS" 'BEGIN { exit !(m <= b) }'; then
            echo "budget=ok" >> "$GITHUB_OUTPUT"
          else
            echo "::error::${monthly} instance-hours/mo at this window would exhaust the ${MONTHLY_INSTANCE_HOURS}-hour budget and Render would suspend every free service. Narrow WARM_FROM_UTC/WARM_TO_UTC."
            exit 1
          fi

      - name: Is it inside the warm window?
        id: window
        run: |
          # `10#` again: `date +%H` returns 08 and 09, which bash reads as
          # invalid octal. Zero-padded hours made the 09:00 tick report
          # "outside the window" -- the first warm hour of the day.
          hour=$(( 10#$(date -u +%H) ))
          minute=$(( 10#$(date -u +%M) ))
          now=$(( hour * 60 + minute ))
          from=$(( 10#"$WARM_FROM_UTC" * 60 ))
          to=$(( 10#"$WARM_TO_UTC" * 60 ))
          # A manual dispatch always warms, so the workflow can be tested (and a
          # sleeping service woken) at any hour without waiting for the window.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "wait_s=0" >> "$GITHUB_OUTPUT"
            echo "warming now (manual dispatch, utc $hour:$minute)"
            exit 0
          fi
          if [ "$now" -ge "$from" ] && [ "$now" -lt "$to" ]; then
            echo "warm=true" >> "$GITHUB_OUTPUT"
            echo "wait_s=0" >> "$GITHUB_OUTPUT"
            echo "warming (utc $hour:$minute)"
            exit 0
          fi
          if [ "$now" -lt "$from" ]; then
            wait_s=$(( (from - now) * 60 ))
            if [ "$wait_s" -le "$MAX_PRE_WINDOW_WAIT_S" ]; then
              echo "warm=true" >> "$GITHUB_OUTPUT"
              echo "wait_s=$wait_s" >> "$GITHUB_OUTPUT"
              echo "utc $hour:$minute is $(( wait_s / 60 )) min before the window: holding this job, then warming"
              exit 0
            fi
          fi
          echo "warm=false" >> "$GITHUB_OUTPUT"
          echo "wait_s=0" >> "$GITHUB_OUTPUT"
          echo "outside the window (utc $hour:$minute): letting them sleep, this costs nothing"

      - name: Hold until the window opens
        if: steps.window.outputs.warm == 'true' && steps.window.outputs.wait_s != '0'
        env:
          WAIT_S: ${{ steps.window.outputs.wait_s }}
        run: |
          echo "holding ${WAIT_S}s until ${WARM_FROM_UTC}:00Z (the services are asleep, so this costs no instance hours)"
          sleep "$WAIT_S"

      # 120s covers a 42s cold start plus Render's boot queue. The worker, when a
      # manual dispatch asks for it, gets 20s instead: its boot is minutes, so
      # holding the request would only make the round late. The request itself is
      # what wakes it.
      #
      # A tick does not ping once and exit -- see the schedule note above. It
      # loops until the window closes, so the 2-5 hour gaps between scheduled
      # ticks no longer leave the services asleep.
      - name: Keep the services awake until the window closes
        if: steps.window.outputs.warm == 'true'
        timeout-minutes: 350
        env:
          WAIT_S: ${{ steps.window.outputs.wait_s }}
        run: |
          set -o pipefail
          failed=0

          # probe <name> <url> <timeout> <strict>
          #   strict=yes -> a non-200 is a failure (the service boots in seconds)
          #   strict=no  -> only a 4xx config error is a failure; "still booting"
          #                 and 429 are warnings, because both are expected once
          probe() {
            name=$1; url=$2; limit=$3; strict=$4
            # `|| true`, not `|| echo 000`: curl already writes 000 when the
            # connection never opened, and appending another made "000000".
            rm -f "/tmp/$name.json"
            code=$(curl -sS -o "/tmp/$name.json" -w '%{http_code}' -m "$limit" "$url" || true)
            code=${code:-000}
            echo "$name http_status=$code"
            head -c 300 "/tmp/$name.json" 2>/dev/null || true
            echo
            case "$code" in
              200) return 0 ;;
              429)
                # The edge is rate-limiting this runner, not refusing the
                # service: the 2026-10-22 incident was exactly this signal read
                # as "asleep". Do not fail the workflow for it.
                echo "::warning::$name /health answered 429 (rate limited); the next tick will retry"
                return 0
                ;;
              401|403|404)
                echo "::error::$name /health answered $code: the URL is the wrong service or the route moved — waiting will not fix that"
                return 1
                ;;
            esac
            if [ "$strict" = "yes" ]; then
              echo "::warning::$name /health answered $code (a cold boot is expected occasionally; a run of failures is not)"
              return 1
            fi
            echo "$name did not answer within ${limit}s ($code): it is booting — the next tick will find it awake"
            return 0
          }

          started=$(date -u +%s)
          # The loop shares the job with any wait above: stop before GitHub's 6 h
          # ceiling so this ends cleanly (and says why) instead of being killed.
          max_s=$(( WARM_CEILING_S - ${WAIT_S:-0} ))
          while :; do
            round_failed=0
            probe engine  https://ftth-planning.onrender.com/health  120 yes || round_failed=1
            probe backend https://fibre-backend-wml3.onrender.com/healthz 120 yes || round_failed=1
            # Off the schedule (WARM_WORKER=false): a run wakes the worker itself
            # and keeps it awake by polling, so a scheduled ping would only spend
            # instance hours. A manual dispatch still warms it.
            if [ "${WARM_WORKER:-false}" = "true" ]; then
              probe worker  "$WORKER_URL/health" 20 no || round_failed=1
            fi
            # Only the last round decides the job's status: a service that was
            # booting on the first round and answered on the next is a success.
            failed=$round_failed
            hour=$(( 10#$(date -u +%H) ))
            if [ "$hour" -ge "$WARM_TO_UTC" ]; then
              echo "window closed at ${hour}:00Z — stopping."
              break
            fi
            if [ $(( $(date -u +%s) - started )) -ge "$max_s" ]; then
              echo "$(( max_s / 60 )) min served; the next queued tick carries on until ${WARM_TO_UTC}:00Z."
              break
            fi
            # A third of Render's 15-minute idle window, so one slow round
            # (three cold services, 120s each) cannot let one fall asleep.
            sleep 300
          done
          exit "$failed"
