name: Build and Push ftth-engine to Docker Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: sanskriti17/ftth_planning

# Avoid racing rebuilds against Docker Hub rate limits and GHA cache thrash.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ftth-engine
    runs-on: ubuntu-latest
    # qgis/qgis:3.44 (~1.5 GB) base pull + source-compiled shapely can be slow
    # on a cold cache. 60 min leaves headroom.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag scheme:
      #   * Release tag v1.2.3        -> :1.2.3, :1.2, :latest
      #   * Prerelease tag v1.2.3-rc1 -> :1.2.3-rc1, :1.2 (no :latest)
      #   * Manual workflow_dispatch  -> :dev
      #
      # `{{ }}` inside the tags block is HANDLEBARS, not Jinja, and it resolves
      # only the globals metadata-action documents — `{{branch}}`, `{{tag}}`,
      # `{{sha}}`, `{{base_ref}}`, `{{is_default_branch}}`, `{{date ...}}`.
      # `event` is not among them, so `enable={{event == 'workflow_dispatch'}}`
      # made the action fail on `Missing helper: event` and this step errored on
      # EVERY event, tag pushes included — which skipped the build outright and
      # is why no image has ever been published.  For GitHub context, `enable`
      # takes a `${{ }}` expression: the action's own README uses
      # `enable=${{ github.ref == format('refs/heads/{0}', 'master') }}`.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/backend/Dockerfile
          # qgis/qgis:3.44 only publishes linux/amd64; multi-arch would fail.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }}

      # Publishing the image is not the same as deploying it.
      #
      # Render cannot be told to watch a Docker Hub tag: `autoDeployTrigger:
      # checksum` is rejected by the API ("Invalid value for autoDeployTrigger:
      # checksum") and `commit` watches a git branch that an image-backed
      # service does not have.  Re-pushing `:1.7.3` was measured on 2026-10-21 --
      # both services sat on their previous deploy for eight minutes -- and that
      # morning's release reached production only because the deploy was called
      # by hand afterwards.  So the deploy is the last step here, where it cannot
      # be forgotten.
      #
      # Needs the repository secret RENDER_API_KEY (Render dashboard -> Account
      # Settings -> API Keys -> Create API Key).  A tag push without it fails
      # this step loudly rather than shipping an image nobody deploys.
      # A deploy REPLACES the container, and every run in flight goes with it:
      # the engine restarts, its thread is gone, and the run is reported as
      # "killed or restarted before this run wrote any output".  On 2026-10-21
      # that wording was read as an out-of-memory kill, but Render recorded no
      # oomKilled event -- seven deploys did it.  So wait for the engine to be
      # idle first, which is cheap when nothing is running (one request).
      - name: Wait for the engine to be idle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -uo pipefail
          unknown=0
          for attempt in $(seq 1 120); do
            body=$(curl -s -m 20 https://ftth-planning.onrender.com/health || true)
            busy=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("runs") or {}; print(int(r.get("running") or 0)+int(r.get("queued") or 0))' 2>/dev/null) || busy=unknown
            case "$busy" in
              0)
                echo "Engine idle after $((attempt - 1)) checks; deploying."
                exit 0 ;;
              unknown)
                unknown=$((unknown + 1))
                if [ "$unknown" -ge 3 ]; then
                  echo "The engine is not answering /health (asleep, or already restarting); deploying."
                  exit 0
                fi
                echo "check $attempt: /health did not answer ($unknown/3)" ;;
              *)
                unknown=0
                echo "check $attempt: running+queued=$busy -- waiting for it to finish" ;;
            esac
            sleep 10
          done
          echo "::warning::the engine still had runs in flight after 20 minutes; deploying anyway -- those runs will be reported as killed or restarted"

      - name: Deploy the published image to Render
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IMAGE_REF: docker.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set for this repository, so the image was built but nothing deploys it." >&2
            exit 1
          fi
          echo "Deploying $IMAGE_REF"
          for pair in "srv-db36torbc2fs73cqhb40:ftth_planning" \
                      "srv-dbbkotu7bikc738t70h0:ftth-qgis-worker"; do
            service_id=${pair%%:*}
            service_name=${pair##*:}
            body=$(printf '{"imageUrl":"%s"}' "$IMAGE_REF")
            code=$(curl -sS -o deploy.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json' \
              -d "$body" \
              "https://api.render.com/v1/services/$service_id/deploys")
            if [ "$code" != "201" ]; then
              echo "::error::$service_name: deploy request returned $code: $(cat deploy.json)" >&2
              exit 1
            fi
            deploy_id=$(python3 -c 'import json; d = json.load(open("deploy.json")); print((d.get("deploy") or d)["id"])')
            echo "$service_name: deploy $deploy_id"
            status=""
            for _ in $(seq 1 60); do
              status=$(curl -sS \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H 'Accept: application/json' \
                "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" \
                | python3 -c 'import json,sys; d = json.load(sys.stdin); print((d.get("deploy") or d).get("status", ""))')
              case "$status" in
                live) echo "$service_name: live"; break ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "::error::$service_name: deploy ended $status" >&2
                  exit 1 ;;
              esac
              sleep 15
            done
            if [ "$status" != "live" ]; then
              echo "::error::$service_name: deploy $deploy_id never reached live (last: $status)" >&2
              exit 1
            fi
          done
