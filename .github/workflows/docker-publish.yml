name: Build and Push ftth-engine to Docker Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE_NAME: sanskriti17/ftth_planning

# Avoid racing rebuilds against Docker Hub rate limits and GHA cache thrash.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & push ftth-engine
    runs-on: ubuntu-latest
    # qgis/qgis:3.44 (~1.5 GB) base pull + source-compiled shapely can be slow
    # on a cold cache. 60 min leaves headroom.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Two failures can live here and they look identical from the dashboard
      # ("the tag did not deploy"): a credential the API rejects, and Render's
      # deploy endpoint answering 500.  The v1.7.56 run on 2026-11-02 went green
      # through "Wait for the engine to be idle" and then failed at the deploy
      # with `ftth_planning: deploy request returned 500: {"message":"internal
      # server error"}` -- leaving 1.7.56 published on Docker Hub and running
      # nowhere.  A 500 there is transient (the identical call succeeded by hand
      # minutes later), which is why the deploy step below now retries it.  This
      # preflight covers the other case before a 20-minute build is spent on it.
      - name: Preflight the Render credential
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set for this repository, so the image would be built but nothing would deploy it. Add it under Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H 'Accept: application/json' \
            'https://api.render.com/v1/services?limit=1')
          if [ "$code" != "200" ]; then
            echo "::error::RENDER_API_KEY was rejected by the Render API (HTTP $code). The build would succeed and the deploy would fail afterwards, so stopping now. Create a fresh key in the Render dashboard (Account Settings -> API Keys) and update this repository's secret." >&2
            exit 1
          fi
          echo "Render credential accepted; building."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tag scheme:
      #   * Release tag v1.2.3        -> :1.2.3, :1.2, :latest
      #   * Prerelease tag v1.2.3-rc1 -> :1.2.3-rc1, :1.2 (no :latest)
      #   * Manual workflow_dispatch  -> :dev
      #
      # `{{ }}` inside the tags block is HANDLEBARS, not Jinja, and it resolves
      # only the globals metadata-action documents — `{{branch}}`, `{{tag}}`,
      # `{{sha}}`, `{{base_ref}}`, `{{is_default_branch}}`, `{{date ...}}`.
      # `event` is not among them, so `enable={{event == 'workflow_dispatch'}}`
      # made the action fail on `Missing helper: event` and this step errored on
      # EVERY event, tag pushes included — which skipped the build outright and
      # is why no image has ever been published.  For GitHub context, `enable`
      # takes a `${{ }}` expression: the action's own README uses
      # `enable=${{ github.ref == format('refs/heads/{0}', 'master') }}`.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web/backend/Dockerfile
          # qgis/qgis:3.44 only publishes linux/amd64; multi-arch would fail.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,scope=${{ github.ref_name }}

      # Publishing the image is not the same as deploying it.
      #
      # Render cannot be told to watch a Docker Hub tag: `autoDeployTrigger:
      # checksum` is rejected by the API ("Invalid value for autoDeployTrigger:
      # checksum") and `commit` watches a git branch that an image-backed
      # service does not have.  Both services also report `autoDeploy: no`
      # today, so a pushed tag deploys nothing on its own.  Re-pushing `:1.7.3`
      # was measured on 2026-10-21 -- both services sat on their previous
      # deploy for eight minutes -- and that morning's release reached
      # production only because the deploy was called by hand afterwards.  So
      # the deploy is the last step here, where it cannot be forgotten.
      #
      # A deploy REPLACES the container, and every run in flight goes with it:
      # the engine restarts, its thread is gone, and the run is reported as
      # "killed or restarted before this run wrote any output".  On 2026-10-21
      # that wording was read as an out-of-memory kill, but Render recorded no
      # oomKilled event -- seven deploys did it.  So wait for the engine to be
      # idle first, which is cheap when nothing is running (one request).
      - name: Wait for the engine to be idle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -uo pipefail
          unknown=0
          for attempt in $(seq 1 120); do
            body=$(curl -s -m 20 https://ftth-planning.onrender.com/health || true)
            busy=$(printf '%s' "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); r=d.get("runs") or {}; print(int(r.get("running") or 0)+int(r.get("queued") or 0))' 2>/dev/null) || busy=unknown
            case "$busy" in
              0)
                echo "Engine idle after $((attempt - 1)) checks; deploying."
                exit 0 ;;
              unknown)
                unknown=$((unknown + 1))
                if [ "$unknown" -ge 3 ]; then
                  echo "The engine is not answering /health (asleep, or already restarting); deploying."
                  exit 0
                fi
                echo "check $attempt: /health did not answer ($unknown/3)" ;;
              *)
                unknown=0
                echo "check $attempt: running+queued=$busy -- waiting for it to finish" ;;
            esac
            sleep 10
          done
          echo "::warning::the engine still had runs in flight after 20 minutes; deploying anyway -- those runs will be reported as killed or restarted"

      - name: Deploy the published image to Render
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          IMAGE_REF: docker.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set for this repository, so the image was built but nothing deploys it." >&2
            exit 1
          fi
          echo "Deploying $IMAGE_REF"
          for pair in "srv-db36torbc2fs73cqhb40:ftth_planning" \
                      "srv-dbbkotu7bikc738t70h0:ftth-qgis-worker"; do
            service_id=${pair%%:*}
            service_name=${pair##*:}
            body=$(printf '{"imageUrl":"%s"}' "$IMAGE_REF")
            # Render answers POST /deploys with a bare 500 "internal server
            # error" while a service is settling from a previous deploy or a
            # spin-down; it is transient, not a rejected request.  Failing on
            # the first one cost the v1.7.56 release its deploy.  Retry those,
            # but never retry an auth/not-found error -- that is the credential.
            code=""
            for attempt in $(seq 1 8); do
              code=$(curl -sS -o deploy.json -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H 'Content-Type: application/json' \
                -H 'Accept: application/json' \
                -d "$body" \
                "https://api.render.com/v1/services/$service_id/deploys" || echo "000")
              if [ "$code" = "201" ]; then
                break
              fi
              case "$code" in
                401|403|404)
                  echo "::error::$service_name: the Render API rejected the deploy ($code): $(cat deploy.json). RENDER_API_KEY is wrong or lacks access to this service." >&2
                  exit 1 ;;
              esac
              echo "$service_name: deploy POST returned $code on attempt $attempt/8: $(cat deploy.json) -- retrying in 20 s"
              sleep 20
            done
            if [ "$code" != "201" ]; then
              echo "::error::$service_name: deploy request never returned 201 (last: $code): $(cat deploy.json)" >&2
              exit 1
            fi
            deploy_id=$(python3 -c 'import json; d = json.load(open("deploy.json")); print((d.get("deploy") or d)["id"])')
            echo "$service_name: deploy $deploy_id"
            status=""
            for _ in $(seq 1 60); do
              status=$(curl -sS \
                -H "Authorization: Bearer $RENDER_API_KEY" \
                -H 'Accept: application/json' \
                "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" \
                | python3 -c 'import json,sys; d = json.load(sys.stdin); print((d.get("deploy") or d).get("status", ""))')
              case "$status" in
                live) break ;;
                build_failed|update_failed|canceled|deactivated)
                  echo "::error::$service_name: deploy ended $status" >&2
                  exit 1 ;;
              esac
              sleep 15
            done
            if [ "$status" != "live" ]; then
              echo "::error::$service_name: deploy $deploy_id never reached live (last: $status)" >&2
              exit 1
            fi
            # `live` only says the deploy finished.  It does not say it runs the
            # image this tag built -- a deploy call that silently fell back to the
            # previously pinned image also reports live.  Compare the ref the
            # service is actually running.
            ref=$(curl -sS \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H 'Accept: application/json' \
              "https://api.render.com/v1/services/$service_id/deploys/$deploy_id" \
              | python3 -c 'import json,sys; d = json.load(sys.stdin); d = d.get("deploy") or d; print((d.get("image") or {}).get("ref", ""))')
            if [ "$ref" != "$IMAGE_REF" ]; then
              echo "::error::$service_name is live on '$ref', not '$IMAGE_REF'" >&2
              exit 1
            fi
            echo "$service_name: live on $IMAGE_REF"
          done
